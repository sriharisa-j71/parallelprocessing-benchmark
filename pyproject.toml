[project]
name = "parallel-processing-benchmark"
version = "0.1.0"
description = "Performance benchmarking framework for parallel data processing approaches combining file processing with API calls"
readme = "README.md"
authors = [
    { name = "sriharisa-j71", email = "your.email@example.com" }
]
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0.0",
    "pandas>=2.1.4",
    "httpx[http2]>=0.27.0",
    "orjson>=3.9.10",
    "dask[complete]>=2025.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.12.0",
    "ruff>=0.1.9",
    "ipython>=8.12.0",
]



# Ruff configuration
[tool.ruff]
line-length = 100
target-version = "py310"

exclude = [
    ".venv",
    ".git",
    "__pycache__",
    "*.egg-info",
    ".pytest_cache",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]

ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

# Black configuration
[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.venv
  | \.git
  | __pycache__
  | \.pytest_cache
)/
'''

[dependency-groups]
dev = [
    "ruff>=0.14.3",
]
